<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>边缘情形增强</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['DM Sans', 'sans-serif'] },
          colors: {
            panel: '#1a1d24',
            card: '#23262d',
            accent: '#0d9488',
            accentHover: '#0f766e',
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .prompt-line { white-space: pre-wrap; }
  </style>
</head>
<body class="bg-slate-100 h-screen w-screen flex overflow-hidden">
  <!-- 左侧：已验证图片列表 -->
  <aside class="w-56 min-w-[180px] max-w-[300px] bg-panel text-white flex flex-col shrink-0 shadow-xl">
    <div class="p-3 border-b border-slate-600 shrink-0">
      <h1 class="text-base font-semibold text-slate-100">边缘情形增强</h1>
      <p class="text-xs text-slate-400 mt-1">仅显示已人工验证的图片</p>
      <a href="/" class="text-xs text-accent hover:underline mt-2 inline-block">← 标注验证</a>
    </div>
    <div class="flex-1 min-h-0 overflow-y-auto p-2 flex flex-col gap-2">
      <p class="text-slate-400 text-sm p-2 shrink-0" id="verifiedEmpty">加载中…</p>
      <div id="verifiedListItems" class="min-h-0 overflow-y-auto"></div>
    </div>
  </aside>

  <!-- 主区域 -->
  <main class="flex-1 flex flex-col min-w-0 min-h-0 overflow-hidden">
    <div class="flex-1 flex min-h-0 overflow-hidden">
      <!-- 左半：当前图 + 描述与目标 -->
      <div class="w-1/2 min-w-0 flex flex-col border-r border-slate-200 bg-white">
        <div class="p-3 border-b border-slate-200 bg-slate-50 shrink-0">
          <span class="text-xs font-semibold text-slate-500 uppercase tracking-wide">当前选择</span>
          <p id="currentImageName" class="text-sm font-medium text-slate-800 mt-0.5 break-all">请从左侧选择一张已验证图片</p>
        </div>
        <div class="flex-1 min-h-0 flex flex-col p-3 gap-3 overflow-auto">
          <div class="group flex-shrink-0 rounded-lg overflow-hidden border border-slate-200 bg-slate-100 flex items-center justify-center min-h-[200px] relative" style="max-height: 280px;">
            <img id="previewImage" alt="" class="w-full h-full object-contain max-h-[280px]" />
            <p id="previewPlaceholder" class="text-slate-400 text-sm absolute inset-0 flex items-center justify-center pointer-events-none">选择左侧图片后可在此查看</p>
            <p id="previewError" class="text-red-500 text-sm absolute inset-0 flex items-center justify-center pointer-events-none hidden">图片加载失败</p>
            <button type="button" id="btnPrevImage" class="absolute left-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/50 hover:bg-black/70 text-white text-xl leading-none flex items-center justify-center shadow transition-opacity opacity-0 group-hover:opacity-100 disabled:opacity-30" title="上一张" aria-label="上一张">‹</button>
            <button type="button" id="btnNextImage" class="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/50 hover:bg-black/70 text-white text-xl leading-none flex items-center justify-center shadow transition-opacity opacity-0 group-hover:opacity-100 disabled:opacity-30" title="下一张" aria-label="下一张">›</button>
            <div id="imageSwitcherCaption" class="absolute bottom-2 left-1/2 -translate-x-1/2 px-2 py-1 rounded bg-black/50 text-white text-xs hidden">原图 1/1</div>
          </div>
          <div class="flex-shrink-0">
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1">场景描述</label>
            <p id="currentScene" class="text-sm text-slate-700 bg-slate-50 rounded-lg p-2 border border-slate-200 min-h-[2.5rem]">—</p>
          </div>
          <div class="flex-shrink-0">
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1">目标列表</label>
            <div id="currentObjects" class="text-sm text-slate-700 bg-slate-50 rounded-lg p-2 border border-slate-200 max-h-32 overflow-y-auto">—</div>
          </div>
          <div class="flex-shrink-0">
            <button type="button" id="btnGeneratePrompts" class="w-full py-2.5 rounded-lg bg-accent hover:bg-accentHover text-white font-medium text-sm transition-colors">
              生成边缘情形提示词（Qwen）
            </button>
          </div>
          <div class="flex-shrink-0 flex-1 min-h-0 flex flex-col">
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">生成图与提示词对照</label>
            <div id="generatedList" class="space-y-3 overflow-y-auto min-h-0 flex-1 pr-1">
              <p class="text-slate-400 text-sm">生成图片后将在此显示：生成图 + 使用的编辑提示词。</p>
            </div>
          </div>
        </div>
      </div>

      <!-- 右半：对话 + 提示词列表 + 生成 -->
      <div class="w-1/2 min-w-0 flex flex-col bg-slate-50">
        <div class="p-3 border-b border-slate-200 bg-white">
          <h2 class="text-sm font-semibold text-slate-700">与 Qwen 讨论提示词</h2>
          <p class="text-xs text-slate-500 mt-0.5">可对模型回复进行追问或修改要求</p>
        </div>
        <div class="flex-1 min-h-0 overflow-y-auto p-3 space-y-2" id="chatArea">
          <p class="text-slate-400 text-sm">点击「生成边缘情形提示词」后，此处显示对话与建议的提示词。</p>
        </div>
        <div class="p-3 border-t border-slate-200 bg-white flex gap-2">
          <input type="text" id="chatInput" placeholder="输入补充说明或修改要求…" class="flex-1 px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-accent/30 focus:border-accent" />
          <button type="button" id="btnSendChat" class="px-4 py-2 rounded-lg bg-slate-600 hover:bg-slate-700 text-white text-sm font-medium">发送</button>
        </div>
        <div class="p-3 border-t border-slate-200 bg-white">
          <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">已生成的提示词（点击「生成图片」将用 qwen-image-edit 生成新图，label 拷贝原图）</h3>
          <ul id="promptsList" class="space-y-2 max-h-40 overflow-y-auto">
            <li class="text-slate-400 text-sm">暂无</li>
          </ul>
        </div>
      </div>
    </div>
  </main>

  <script>
    const state = {
      baseUrl: '',
      images: [],
      current: null,
      chatHistory: [],
      prompts: [],
      generated: [],  // [{ prompt, newName }] 当前原图对应的生成图与提示词
      viewableImages: [],  // 当前原图 + 已存在的 edge 变体列表（原图在前）
      viewIndex: 0,        // 当前查看的是第几张，0 = 原图
    };

    function api(path) {
      return fetch(state.baseUrl + path).then(r => r.json());
    }
    function apiPost(path, body) {
      return fetch(state.baseUrl + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      }).then(r => r.json());
    }

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s ?? '';
      return div.innerHTML;
    }

    function renderVerifiedList() {
      const el = document.getElementById('verifiedListItems');
      const empty = document.getElementById('verifiedEmpty');
      if (!el || !empty) return;
      if (!state.images.length) {
        empty.textContent = '暂无已验证图片，请先在「标注验证」中勾选并保存。';
        empty.classList.remove('hidden');
        el.innerHTML = '';
        return;
      }
      empty.classList.add('hidden');
      el.innerHTML = '';
      state.images.forEach(img => {
        const isSelected = state.current && state.current.name === img.name;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'verified-btn w-full text-left px-2 py-2 rounded-lg mb-1 text-sm transition-colors flex items-center gap-2 ' +
          (isSelected ? 'bg-accent/25 text-accent border-l-4 border-accent' : 'hover:bg-slate-700 text-slate-300');
        const thumb = document.createElement('img');
        thumb.src = state.baseUrl + '/api/image/' + encodeURIComponent(img.name);
        thumb.alt = '';
        thumb.className = 'w-10 h-10 object-cover rounded flex-shrink-0';
        thumb.onerror = function() { this.style.display = 'none'; };
        const label = document.createElement('span');
        label.className = 'min-w-0 truncate flex-1';
        label.textContent = img.name;
        label.title = (img.scene || img.name).slice(0, 200);
        btn.appendChild(thumb);
        btn.appendChild(label);
        if (isSelected) {
          const badge = document.createElement('span');
          badge.className = 'text-xs font-semibold text-accent flex-shrink-0';
          badge.textContent = '当前';
          btn.appendChild(badge);
        }
        btn.dataset.name = img.name;
        btn.addEventListener('click', () => selectImage(img));
        el.appendChild(btn);
      });
    }

    function showViewableImage() {
      var list = state.viewableImages;
      var idx = state.viewIndex;
      var nameEl = document.getElementById('currentImageName');
      var previewImg = document.getElementById('previewImage');
      var placeholder = document.getElementById('previewPlaceholder');
      var previewError = document.getElementById('previewError');
      var btnPrev = document.getElementById('btnPrevImage');
      var btnNext = document.getElementById('btnNextImage');
      var caption = document.getElementById('imageSwitcherCaption');
      if (!previewImg || !list.length) return;
      var name = list[idx];
      if (nameEl) { nameEl.textContent = name; nameEl.title = name; }
      if (placeholder) placeholder.classList.remove('hidden');
      if (previewError) previewError.classList.add('hidden');
      var imgUrl = state.baseUrl + '/api/image/' + encodeURIComponent(name);
      previewImg.alt = name;
      previewImg.onload = function() {
        if (placeholder) placeholder.classList.add('hidden');
        if (previewError) previewError.classList.add('hidden');
      };
      previewImg.onerror = function() {
        if (placeholder) placeholder.classList.add('hidden');
        if (previewError) previewError.classList.remove('hidden');
      };
      previewImg.src = imgUrl;
      if (btnPrev) btnPrev.disabled = list.length <= 1;
      if (btnNext) btnNext.disabled = list.length <= 1;
      if (caption) {
        var label = idx === 0 ? '原图' : ('边缘' + idx);
        caption.textContent = label + ' ' + (idx + 1) + '/' + list.length;
        caption.classList.remove('hidden');
      }
    }

    function selectImage(img) {
      state.current = img;
      state.chatHistory = [];
      state.prompts = [];
      state.generated = [];
      renderVerifiedList();

      var nameEl = document.getElementById('currentImageName');
      var sceneEl = document.getElementById('currentScene');
      var objsEl = document.getElementById('currentObjects');
      var chatArea = document.getElementById('chatArea');
      var promptsList = document.getElementById('promptsList');
      var chatInput = document.getElementById('chatInput');
      var caption = document.getElementById('imageSwitcherCaption');
      if (nameEl) nameEl.textContent = img.name;
      if (sceneEl) sceneEl.textContent = (img.scene || '—').trim() || '—';
      if (objsEl) {
        const objs = (img.objects || []).map(o => `${o.category} (${o.x_min?.toFixed(2)}, ${o.y_min?.toFixed(2)}, ${o.x_max?.toFixed(2)}, ${o.y_max?.toFixed(2)})`).join('\n');
        objsEl.textContent = objs || '—';
      }
      if (chatArea) chatArea.innerHTML = '<p class="text-slate-400 text-sm">点击「生成边缘情形提示词」开始。</p>';
      if (promptsList) promptsList.innerHTML = '<li class="text-slate-400 text-sm">暂无</li>';
      if (chatInput) chatInput.value = '';
      renderGeneratedList();

      state.viewableImages = [img.name];
      state.viewIndex = 0;
      if (caption) caption.classList.add('hidden');
      fetch(state.baseUrl + '/api/augment/edge-images?name=' + encodeURIComponent(img.name))
        .then(function(r) { return r.ok ? r.json() : Promise.resolve({ images: [] }); })
        .then(function(data) {
          var images = (data && data.images) ? data.images : [];
          if (images.length) {
            state.viewableImages = images;
            state.viewIndex = 0;
          }
          showViewableImage();
        })
        .catch(function() { showViewableImage(); });
    }

    function renderGeneratedList() {
      const container = document.getElementById('generatedList');
      if (!state.generated.length) {
        container.innerHTML = '<p class="text-slate-400 text-sm">生成图片后将在此显示：生成图 + 使用的编辑提示词。</p>';
        return;
      }
      container.innerHTML = state.generated.map((item, i) => {
        const imgUrl = state.baseUrl + '/api/image/' + encodeURIComponent(item.newName);
        return '<div class="rounded-lg border border-slate-200 bg-white overflow-hidden shadow-sm">' +
          '<div class="p-2 bg-slate-50 border-b border-slate-200 text-xs font-medium text-slate-600">生成图 ' + (i + 1) + ': ' + escapeHtml(item.newName) + '</div>' +
          '<div class="p-2 flex gap-2">' +
            '<div class="flex-shrink-0 w-32 h-32 rounded border border-slate-200 overflow-hidden bg-slate-100">' +
              '<img src="' + imgUrl + '" alt="' + escapeHtml(item.newName) + '" class="w-full h-full object-contain" />' +
            '</div>' +
            '<div class="flex-1 min-w-0">' +
              '<span class="text-xs font-semibold text-slate-500 block mb-1">使用的编辑提示词：</span>' +
              '<p class="text-sm text-slate-700 break-words">' + escapeHtml(item.prompt) + '</p>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function appendChat(role, content) {
      const area = document.getElementById('chatArea');
      const firstHint = area.querySelector('p.text-slate-400');
      if (firstHint) firstHint.remove();
      const div = document.createElement('div');
      div.className = 'rounded-lg p-2 ' + (role === 'user' ? 'bg-accent/10 ml-4' : 'bg-white border border-slate-200 mr-4');
      div.innerHTML = '<span class="text-xs font-semibold text-slate-500">' + (role === 'user' ? '我' : 'Qwen') + '</span><pre class="prompt-line text-sm mt-1 whitespace-pre-wrap">' + escapeHtml(content) + '</pre>';
      area.appendChild(div);
      area.scrollTop = area.scrollHeight;
    }

    function parsePromptLines(text) {
      const lines = (text || '').split(/\n/).map(s => s.trim()).filter(Boolean);
      const result = [];
      const skipPatterns = [/^(\d+[\.\、]\s*)?/, /^[-*]\s*/];
      for (const line of lines) {
        let t = line.replace(/^\d+[\.\、]\s*/, '').replace(/^[-*]\s*/, '').trim();
        if (t.length > 5) result.push(t);
      }
      return result.length ? result : (text || '').trim() ? [text.trim()] : [];
    }

    function renderPromptsList() {
      const ul = document.getElementById('promptsList');
      if (!state.prompts.length) {
        ul.innerHTML = '<li class="text-slate-400 text-sm">暂无</li>';
        return;
      }
      ul.innerHTML = state.prompts.map((p, i) => {
        return '<li class="flex items-start gap-2 border border-slate-200 rounded-lg p-2 bg-white">' +
          '<span class="prompt-line text-sm flex-1 min-w-0">' + escapeHtml(p) + '</span>' +
          '<button type="button" class="btnGenerateImage flex-shrink-0 px-2 py-1 rounded bg-accent hover:bg-accentHover text-white text-xs" data-idx="' + i + '">生成图片</button>' +
          '</li>';
      }).join('');
      ul.querySelectorAll('.btnGenerateImage').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.getAttribute('data-idx'), 10);
          const prompt = state.prompts[idx];
          if (prompt === undefined || !state.current) return;
          generateImage(prompt, btn);
        });
      });
    }

    function generateImage(editPrompt, btnEl) {
      if (!state.current) return;
      const origText = btnEl.textContent;
      btnEl.disabled = true;
      btnEl.textContent = '生成中…';
      apiPost('/api/augment/generate', { imageName: state.current.name, editPrompt: editPrompt })
        .then(res => {
          if (res.ok) {
            state.generated.push({ prompt: editPrompt, newName: res.newName });
            renderGeneratedList();
            btnEl.textContent = '已生成: ' + res.newName;
            btnEl.classList.remove('bg-accent', 'hover:bg-accentHover');
            btnEl.classList.add('bg-green-600');
          } else {
            btnEl.textContent = res.error || '失败';
            btnEl.disabled = false;
          }
        })
        .catch(() => {
          btnEl.textContent = origText;
          btnEl.disabled = false;
        });
    }

    document.getElementById('btnGeneratePrompts').addEventListener('click', () => {
      if (!state.current) return;
      const btn = document.getElementById('btnGeneratePrompts');
      btn.disabled = true;
      btn.textContent = '生成中…';
      apiPost('/api/augment/prompts', {
        imageName: state.current.name,
        chatHistory: state.chatHistory,
        userMessage: '',
      }).then(res => {
        btn.disabled = false;
        btn.textContent = '生成边缘情形提示词（Qwen）';
        if (res.ok) {
          state.chatHistory.push({ role: 'user', content: '请根据该图片的标注信息生成多条边缘情形编辑提示词（每行一条）。' });
          state.chatHistory.push({ role: 'assistant', content: res.text });
          appendChat('assistant', res.text);
          const newPrompts = parsePromptLines(res.text);
          newPrompts.forEach(p => { if (p && !state.prompts.includes(p)) state.prompts.push(p); });
          renderPromptsList();
        } else {
          appendChat('assistant', '错误: ' + (res.error || '未知'));
        }
      }).catch(() => {
        btn.disabled = false;
        btn.textContent = '生成边缘情形提示词（Qwen）';
      });
    });

    document.getElementById('btnSendChat').addEventListener('click', () => {
      const input = document.getElementById('chatInput');
      const msg = (input.value || '').trim();
      if (!msg || !state.current) return;
      state.chatHistory.push({ role: 'user', content: msg });
      appendChat('user', msg);
      input.value = '';
      const btn = document.getElementById('btnSendChat');
      btn.disabled = true;
      apiPost('/api/augment/prompts', {
        imageName: state.current.name,
        chatHistory: state.chatHistory.slice(0, -1),
        userMessage: msg,
      }).then(res => {
        btn.disabled = false;
        if (res.ok) {
          state.chatHistory.push({ role: 'assistant', content: res.text });
          appendChat('assistant', res.text);
          const newPrompts = parsePromptLines(res.text);
          newPrompts.forEach(p => { if (p && !state.prompts.includes(p)) state.prompts.push(p); });
          renderPromptsList();
        } else {
          state.chatHistory.push({ role: 'assistant', content: '错误: ' + (res.error || '未知') });
          appendChat('assistant', '错误: ' + (res.error || '未知'));
        }
      }).catch(() => { btn.disabled = false; });
    });

    document.getElementById('chatInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('btnSendChat').click();
      }
    });

    document.getElementById('btnPrevImage').addEventListener('click', function() {
      if (state.viewableImages.length <= 1) return;
      state.viewIndex = (state.viewIndex - 1 + state.viewableImages.length) % state.viewableImages.length;
      showViewableImage();
    });
    document.getElementById('btnNextImage').addEventListener('click', function() {
      if (state.viewableImages.length <= 1) return;
      state.viewIndex = (state.viewIndex + 1) % state.viewableImages.length;
      showViewableImage();
    });

    api('/api/augment/verified-images').then(data => {
      state.images = data.images || [];
      state.baseUrl = '';
      renderVerifiedList();
      if (state.images.length) selectImage(state.images[0]);
    }).catch(() => {
      var emptyEl = document.getElementById('verifiedEmpty');
      if (emptyEl) emptyEl.textContent = '加载失败';
    });
  </script>
</body>
</html>
